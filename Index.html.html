<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="لعبة برا السالفة - لعبة تفاعلية متعددة اللاعبين عبر الإنترنت">
  <meta name="keywords" content="لعبة، برا السالفة، ألعاب اجتماعية">
  <meta name="theme-color" content="#667eea">
  <title>لعبة برا السالفة</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 15px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 700px;
      width: 100%;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #667eea;
      font-size: 28px;
    }
    
    h2 {
      color: #667eea;
      margin-bottom: 20px;
      font-size: 22px;
    }
    
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #eee;
      overflow-x: auto;
    }
    
    .tab-btn {
      padding: 10px 20px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 16px;
      color: #999;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
      white-space: nowrap;
    }
    
    .tab-btn.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }
    
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    .input-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #333;
    }
    
    input, select {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
    }
    
    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }
    
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .error {
      background: #fee;
      border-left: 4px solid #f00;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 4px;
      color: #c00;
      display: none;
    }
    
    .error.show {
      display: block;
    }
    
    .success {
      background: #efe;
      border-left: 4px solid #0f0;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 4px;
      color: #0a0;
      display: none;
    }
    
    .success.show {
      display: block;
    }
    
    .room-code {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      margin: 20px 0;
    }
    
    .room-code-value {
      font-size: 32px;
      font-weight: bold;
      color: #667eea;
      margin: 10px 0;
      cursor: pointer;
      user-select: all;
    }
    
    .room-code-value:hover {
      background: #e8e8ff;
      padding: 10px;
      border-radius: 4px;
    }
    
    .players-list {
      background: #f9f9f9;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
    }
    
    .player-item {
      padding: 10px;
      background: white;
      margin: 8px 0;
      border-radius: 4px;
      border-left: 4px solid #667eea;
    }
    
    .player-item.creator {
      border-left-color: #ff9800;
      background: #fff9f0;
    }
    
    .player-name {
      font-weight: bold;
      color: #333;
    }
    
    .player-badge {
      display: inline-block;
      background: #ff9800;
      color: white;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 12px;
      margin-right: 5px;
    }
    
    .word-display {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      margin: 20px 0;
      font-size: 48px;
      font-weight: bold;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .word-display.spy {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
    }
    
    .word-label {
      font-size: 14px;
      color: rgba(255,255,255,0.8);
      margin-bottom: 10px;
    }
    
    .voting-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 20px 0;
    }
    
    .voting-btn {
      padding: 15px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .voting-btn:hover:not(:disabled) {
      background: #ff5252;
      transform: scale(1.05);
    }
    
    .voting-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .result-card {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
      text-align: center;
    }
    
    .result-title {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
    }
    
    .result-value {
      font-size: 24px;
      color: #667eea;
      font-weight: bold;
    }
    
    .result-value.spy-eliminated {
      color: #4caf50;
    }
    
    .result-value.spy-survived {
      color: #ff6b6b;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
    }
    
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .game-status {
      background: #e3f2fd;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      text-align: center;
      color: #1976d2;
      font-weight: bold;
    }
    
    .current-player {
      background: #fff3e0;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      text-align: center;
      color: #e65100;
      font-weight: bold;
    }
    
    .voting-progress {
      background: #f0f0f0;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      text-align: center;
    }
    
    .progress-bar {
      width: 100%;
      height: 10px;
      background: #ddd;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 10px;
    }
    
    .progress-fill {
      height: 100%;
      background: #667eea;
      transition: width 0.3s;
    }
    
    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }
      
      h1 {
        font-size: 24px;
      }
      
      .word-display {
        font-size: 36px;
        padding: 30px;
        min-height: 120px;
      }
      
      .voting-buttons {
        grid-template-columns: 1fr;
      }
      
      button {
        padding: 15px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 برا السالفة</h1>
    
    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen">
      <div class="input-group">
        <label>اسمك:</label>
        <input type="text" id="playerName" placeholder="أدخل اسمك" maxlength="20">
      </div>
      <button onclick="goToRoomSelection()">ابدأ اللعبة</button>
    </div>
    
    <!-- شاشة اختيار الغرفة -->
    <div id="roomSelectionScreen" style="display: none;">
      <div class="error" id="errorMsg"></div>
      <div class="success" id="successMsg"></div>
      
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('create', event)">إنشاء غرفة</button>
        <button class="tab-btn" onclick="switchTab('join', event)">الانضمام</button>
        <button class="tab-btn" onclick="switchTab('code', event)">من رمز</button>
      </div>
      
      <!-- تبويب إنشاء غرفة -->
      <div id="create" class="tab-content active">
        <div class="input-group">
          <label>اسم الغرفة:</label>
          <input type="text" id="roomName" placeholder="أدخل اسم الغرفة" maxlength="30">
        </div>
        
        <div class="input-group">
          <label>نوع الغرفة:</label>
          <div style="display: flex; gap: 10px;">
            <button id="privateBtn" onclick="selectRoomType('private')" style="flex: 1; background: #667eea;">خاصة</button>
            <button id="publicBtn" onclick="selectRoomType('public')" style="flex: 1; background: #999;">عامة</button>
          </div>
        </div>
        
        <div class="input-group">
          <label>اختر القسم:</label>
          <select id="categorySelect">
            <option value="mix">المكس (خليط)</option>
            <option value="saudi_league">الدوري السعودي</option>
            <option value="foreign_players">اللاعبين الأجانب</option>
            <option value="cars">السيارات</option>
            <option value="food_detailed">الطعام</option>
            <option value="drinks">المشروبات</option>
            <option value="objects">الجمادات</option>
            <option value="video_games">ألعاب الفيديو</option>
            <option value="restaurants">المطاعم</option>
            <option value="cafes">المقاهي</option>
          </select>
        </div>
        
        <button onclick="createRoom()">إنشاء الغرفة</button>
      </div>
      
      <!-- تبويب الانضمام للغرف العامة -->
      <div id="join" class="tab-content">
        <button onclick="loadRooms()" style="margin-bottom: 20px;">تحديث الغرف</button>
        <div id="roomsList"></div>
      </div>
      
      <!-- تبويب الانضمام برمز -->
      <div id="code" class="tab-content">
        <div class="input-group">
          <label>أدخل رمز الغرفة:</label>
          <input type="text" id="roomCode" placeholder="أدخل الرمز (6 أحرف)" maxlength="6" style="text-transform: uppercase;">
        </div>
        <button onclick="joinByCode()">الانضمام</button>
      </div>
    </div>
    
    <!-- شاشة الغرفة -->
    <div id="roomScreen" style="display: none;">
      <div class="error" id="roomErrorMsg"></div>
      <div class="success" id="roomSuccessMsg"></div>
      
      <h2>الغرفة</h2>
      
      <div class="room-code" id="roomCodeDisplay" style="display: none;">
        <div>رمز الغرفة:</div>
        <div class="room-code-value" id="roomCodeValue" onclick="copyRoomCode()">نسخ</div>
        <small>اضغط لنسخ الرمز</small>
      </div>
      
      <div class="players-list">
        <h3>اللاعبين:</h3>
        <div id="playersList"></div>
      </div>
      
      <button id="startGameBtn" onclick="startGame()" style="display: none;">ابدأ اللعبة</button>
      <button onclick="leaveRoom()">مغادرة الغرفة</button>
    </div>
    
    <!-- شاشة اللعبة -->
    <div id="gameScreen" style="display: none;">
      <div class="error" id="gameErrorMsg"></div>
      
      <div class="game-status" id="gameStatus"></div>
      
      <div class="word-display" id="wordDisplay"></div>
      
      <div class="current-player" id="currentPlayerDisplay"></div>
      
      <button id="finishQuestionBtn" onclick="finishQuestion()">خلصت السؤال</button>
      
      <div id="votingScreen" style="display: none;">
        <h2>التصويت</h2>
        <div class="voting-progress">
          <div id="votingProgressText"></div>
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
          </div>
        </div>
        <div class="voting-buttons" id="votingButtons"></div>
      </div>
      
      <button onclick="leaveRoom()" style="margin-top: 20px;">مغادرة اللعبة</button>
    </div>
    
    <!-- شاشة النتيجة -->
    <div id="resultScreen" style="display: none;">
      <h2>النتيجة</h2>
      
      <div class="result-card">
        <div class="result-title">اللاعب المُستبعد:</div>
        <div class="result-value" id="eliminatedPlayerName"></div>
      </div>
      
      <div class="result-card">
        <div class="result-title">الكلمة:</div>
        <div class="result-value" id="wordResult"></div>
      </div>
      
      <div class="result-card">
        <div class="result-title">المندس:</div>
        <div class="result-value" id="spyResult"></div>
      </div>
      
      <div class="result-card" id="resultMessage"></div>
      
      <button onclick="leaveRoom()">مغادرة اللعبة</button>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script>
    // ============================================
    // متغيرات عامة
    // ============================================
    let socket = null;
    let userId = localStorage.getItem('userId') || generateUserId();
    let displayName = '';
    let roomId = null;
    let roomCode = null;
    let creatorId = null;
    let currentWord = '';
    let isSpy = false;
    let players = [];
    let currentQuestionPlayer = 0;
    let roomType = 'private';
    let hasVoted = false;
    let reconnectAttempts = 0;
    const MAX_RECONNECT_ATTEMPTS = 5;
    
    // حفظ معرّف المستخدم
    localStorage.setItem('userId', userId);
    
    // ============================================
    // دالة توليد معرّف فريد
    // ============================================
    function generateUserId() {
      return 'user_' + Math.random().toString(36).substr(2, 9);
    }
    
    // ============================================
    // الاتصال بـ Socket.io
    // ============================================
    function connectSocket() {
      socket = io();
      
      socket.on('connect', () => {
        console.log('✅ متصل بالسيرفر');
        reconnectAttempts = 0;
        
        // ✅ محاولة استعادة الغرفة عند إعادة الاتصال
        if (roomId) {
          socket.emit('joinRoom', {
            userId,
            displayName,
            roomId
          });
        }
      });
      
      socket.on('disconnect', () => {
        console.log('❌ قطع الاتصال');
      });
      
      socket.on('error', (data) => {
        showError(data.message);
      });
      
      socket.on('roomCreated', (data) => {
        roomId = data.roomId;
        roomCode = data.roomCode;
        creatorId = userId;
        showRoomScreen();
        displayRoomCode();
        updatePlayersList(data.room.players);
      });
      
      socket.on('joinedRoom', (data) => {
        roomId = data.roomId;
        roomCode = data.roomCode;
        creatorId = data.creatorId;
        showRoomScreen();
        displayRoomCode();
        updatePlayersList(data.players);
      });
      
      socket.on('playerJoined', (data) => {
        updatePlayersList(data.players);
      });
      
      socket.on('playerLeft', (data) => {
        updatePlayersList(data.players);
      });
      
      socket.on('gameStarted', (data) => {
        currentWord = data.word;
        isSpy = data.isSpy;
        players = data.players;
        currentQuestionPlayer = data.currentQuestionPlayer;
        showGameScreen();
        displayWord();
      });
      
      socket.on('nextQuestion', (data) => {
        players = data.players;
        currentQuestionPlayer = data.currentQuestionPlayer;
        hasVoted = false;
        updateCurrentPlayer();
      });
      
      socket.on('votingProgress', (data) => {
        const percentage = (data.votedCount / data.totalPlayers) * 100;
        document.getElementById('progressFill').style.width = percentage + '%';
        document.getElementById('votingProgressText').textContent = 
          `${data.votedCount} من ${data.totalPlayers} لاعب صوتوا`;
      });
      
      socket.on('gameResult', (data) => {
        showResultScreen(data);
      });
      
      socket.on('waitingForNextRound', (data) => {
        showWaitingScreen();
      });
      
      // ✅ فحص الاتصال الدوري
      setInterval(() => {
        if (socket && socket.connected) {
          socket.emit('ping');
        }
      }, 30000);
    }
    
    connectSocket();
    
    // ============================================
    // دوال الشاشات
    // ============================================
    function goToRoomSelection() {
      displayName = document.getElementById('playerName').value.trim();
      
      if (!displayName || displayName.length === 0 || displayName.length > 20) {
        showError('اسم اللاعب غير صحيح');
        return;
      }
      
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('roomSelectionScreen').style.display = 'block';
      loadRooms();
    }
    
    function switchTab(tab, event) {
      event.preventDefault();
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      if (event && event.target) {
        event.target.classList.add('active');
      }
      
      if (tab === 'join') {
        loadRooms();
      }
    }
    
    function selectRoomType(type) {
      roomType = type;
      document.getElementById('privateBtn').style.background = type === 'private' ? '#667eea' : '#999';
      document.getElementById('publicBtn').style.background = type === 'public' ? '#667eea' : '#999';
    }
    
    function createRoom() {
      const roomName = document.getElementById('roomName').value.trim();
      const category = document.getElementById('categorySelect').value;
      
      if (!roomName || roomName.length === 0) {
        showError('أدخل اسم الغرفة');
        return;
      }
      
      socket.emit('createRoom', {
        userId,
        displayName,
        roomName,
        category,
        isPublic: roomType === 'public'
      });
    }
    
    function joinByCode() {
      const code = document.getElementById('roomCode').value.trim().toUpperCase();
      
      if (!code || code.length !== 6) {
        showError('أدخل رمز صحيح (6 أحرف)');
        return;
      }
      
      socket.emit('joinRoom', {
        userId,
        displayName,
        roomCode: code
      });
    }
    
    function loadRooms() {
      fetch('/api/rooms')
        .then(res => res.json())
        .then(rooms => {
          const roomsList = document.getElementById('roomsList');
          if (rooms.length === 0) {
            roomsList.innerHTML = '<p style="text-align: center; color: #999;">لا توجد غرف متاحة</p>';
            return;
          }
          
          roomsList.innerHTML = rooms.map(room => `
            <div class="player-item" style="cursor: pointer;" onclick="joinRoom('${room.id}')">
              <div class="player-name">${room.name}</div>
              <small>${room.playerCount}/${room.maxPlayers} لاعب - ${room.category}</small>
            </div>
          `).join('');
        })
        .catch(err => console.error('خطأ في تحميل الغرف:', err));
    }
    
    function joinRoom(rid) {
      socket.emit('joinRoom', {
        userId,
        displayName,
        roomId: rid
      });
    }
    
    function showRoomScreen() {
      document.getElementById('roomSelectionScreen').style.display = 'none';
      document.getElementById('roomScreen').style.display = 'block';
      
      // ✅ إظهار زر البدء فقط للمنشئ
      if (userId === creatorId) {
        document.getElementById('startGameBtn').style.display = 'block';
      } else {
        document.getElementById('startGameBtn').style.display = 'none';
      }
    }
    
    function displayRoomCode() {
      if (roomType === 'private' && roomCode) {
        document.getElementById('roomCodeDisplay').style.display = 'block';
        document.getElementById('roomCodeValue').textContent = roomCode;
      }
    }
    
    function copyRoomCode() {
      navigator.clipboard.writeText(roomCode).then(() => {
        showSuccess('✅ تم نسخ الرمز');
      });
    }
    
    function updatePlayersList(playersList) {
      players = playersList;
      const list = document.getElementById('playersList');
      list.innerHTML = playersList.map(player => `
        <div class="player-item ${player.id === creatorId ? 'creator' : ''}">
          ${player.id === creatorId ? '<span class="player-badge">مضيف</span>' : ''}
          <span class="player-name">${player.name}</span>
        </div>
      `).join('');
    }
    
    function startGame() {
      // ✅ التحقق من عدد اللاعبين
      if (players.length < 3) {
        showError('يجب أن يكون هناك 3 لاعبين على الأقل');
        return;
      }
      
      // ✅ تعطيل الزر لمنع الضغط المتكرر
      document.getElementById('startGameBtn').disabled = true;
      
      socket.emit('startGame', {
        userId
      });
    }
    
    function showGameScreen() {
      document.getElementById('roomScreen').style.display = 'none';
      document.getElementById('gameScreen').style.display = 'block';
      document.getElementById('votingScreen').style.display = 'none';
      document.getElementById('finishQuestionBtn').style.display = 'block';
      hasVoted = false;
      updateCurrentPlayer();
    }
    
    function displayWord() {
      const wordDisplay = document.getElementById('wordDisplay');
      if (isSpy) {
        wordDisplay.classList.add('spy');
        wordDisplay.innerHTML = `
          <div>
            <div class="word-label">أنت المندس!</div>
            <div>${currentWord}</div>
          </div>
        `;
      } else {
        wordDisplay.classList.remove('spy');
        wordDisplay.innerHTML = `
          <div>
            <div class="word-label">الكلمة:</div>
            <div>${currentWord}</div>
          </div>
        `;
      }
    }
    
    function updateCurrentPlayer() {
      const currentPlayer = players[currentQuestionPlayer];
      document.getElementById('currentPlayerDisplay').textContent = 
        `دور: ${currentPlayer.name}`;
    }
    
    function finishQuestion() {
      document.getElementById('finishQuestionBtn').disabled = true;
      socket.emit('finishQuestion', {});
      setTimeout(() => {
        document.getElementById('finishQuestionBtn').disabled = false;
      }, 1000);
    }
    
    function showVotingScreen() {
      document.getElementById('finishQuestionBtn').style.display = 'none';
      document.getElementById('votingScreen').style.display = 'block';
      
      const votingButtons = document.getElementById('votingButtons');
      votingButtons.innerHTML = players.map(player => `
        <button class="voting-btn" onclick="vote('${player.id}')" ${hasVoted ? 'disabled' : ''}>
          ${player.name}
        </button>
      `).join('');
    }
    
    function vote(targetId) {
      if (hasVoted) return;
      
      // ✅ منع التصويت على النفس
      if (targetId === userId) {
        showError('لا يمكن التصويت على نفسك');
        return;
      }
      
      hasVoted = true;
      socket.emit('vote', {
        voterId: userId,
        targetId
      });
      
      // تعطيل جميع أزرار التصويت
      document.querySelectorAll('.voting-btn').forEach(btn => btn.disabled = true);
    }
    
    function showWaitingScreen() {
      document.getElementById('gameScreen').style.display = 'none';
      document.getElementById('resultScreen').style.display = 'block';
      
      setTimeout(() => {
        // ✅ الانتقال التلقائي للجولة الجديدة
        showGameScreen();
        displayWord();
      }, 5000);
    }
    
    function showResultScreen(data) {
      document.getElementById('gameScreen').style.display = 'none';
      document.getElementById('resultScreen').style.display = 'block';
      
      document.getElementById('eliminatedPlayerName').textContent = data.eliminatedPlayer.name;
      document.getElementById('wordResult').textContent = data.word;
      document.getElementById('spyResult').textContent = data.spyPlayer;
      
      const resultMessage = document.getElementById('resultMessage');
      if (data.isSpyEliminated) {
        resultMessage.innerHTML = '<div style="color: #4caf50; font-weight: bold;">✅ فاز الجميع! تم القضاء على المندس!</div>';
      } else {
        resultMessage.innerHTML = '<div style="color: #ff6b6b; font-weight: bold;">❌ فاز المندس!</div>';
      }
    }
    
    function leaveRoom() {
      location.reload();
    }
    
    // ============================================
    // دوال الرسائل
    // ============================================
    function showError(message) {
      const errorDiv = document.getElementById('errorMsg') || document.getElementById('roomErrorMsg') || document.getElementById('gameErrorMsg');
      if (errorDiv) {
        errorDiv.textContent = message;
        errorDiv.classList.add('show');
        setTimeout(() => errorDiv.classList.remove('show'), 5000);
      }
    }
    
    function showSuccess(message) {
      const successDiv = document.getElementById('successMsg') || document.getElementById('roomSuccessMsg');
      if (successDiv) {
        successDiv.textContent = message;
        successDiv.classList.add('show');
        setTimeout(() => successDiv.classList.remove('show'), 5000);
      }
    }
  </script>
</body>
</html>
