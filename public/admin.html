<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - برا السالفة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }

        .login-box h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
        }

        .error-message {
            background: #ff6b6b;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .dashboard {
            display: none;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #333;
            font-size: 24px;
        }

        .logout-btn {
            background: #ff6b6b;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .tab-btn {
            padding: 10px 20px;
            background: #f0f0f0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab-content {
            display: none;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .tab-content.active {
            display: block;
        }

        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }

        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .users-list {
            list-style: none;
        }

        .user-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .success-message {
            background: #51cf66;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .tabs {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <!-- صفحة تسجيل الدخول -->
    <div class="login-page" id="loginPage">
        <div class="login-box">
            <h1>🎛️ لوحة التحكم</h1>
            <div class="error-message" id="errorMessage"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" required placeholder="b7239355@gmail.com">
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="login-btn">دخول</button>
            </form>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div class="dashboard" id="dashboard">
        <div class="header">
            <h1>🎛️ لوحة التحكم</h1>
            <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
        </div>

        <!-- الإحصائيات -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>👥 المستخدمون الحاليون</h3>
                <div class="value" id="onlineUsers">0</div>
            </div>
            <div class="stat-card">
                <h3>📊 إجمالي الزيارات</h3>
                <div class="value" id="totalVisits">0</div>
            </div>
            <div class="stat-card">
                <h3>⏱️ متوسط وقت اللعب</h3>
                <div class="value" id="avgPlaytime">0 دقيقة</div>
            </div>
            <div class="stat-card">
                <h3>👤 إجمالي المستخدمين</h3>
                <div class="value" id="totalUsers">0</div>
            </div>
        </div>

        <!-- التبويبات -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('ads')">📢 الإعلانات</button>
            <button class="tab-btn" onclick="switchTab('users')">👥 المستخدمون</button>
            <button class="tab-btn" onclick="switchTab('settings')">⚙️ الإعدادات</button>
        </div>

        <!-- تبويب الإعلانات -->
        <div class="tab-content active" id="ads">
            <h2>إضافة إعلان جديد</h2>
            <div class="success-message" id="successMessage"></div>
            <form id="adForm" style="margin-bottom: 30px;">
                <div class="form-group">
                    <label>العنوان</label>
                    <input type="text" id="adTitle" required placeholder="عنوان الإعلان">
                </div>
                <div class="form-group">
                    <label>الوصف</label>
                    <textarea id="adDescription" required placeholder="وصف الإعلان..."></textarea>
                </div>
                <div class="form-group">
                    <label>الصورة</label>
                    <input type="file" id="adImage" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label>الرابط (اختياري)</label>
                    <input type="url" id="adLink" placeholder="https://example.com">
                </div>
                <div class="form-group">
                    <label>تاريخ البداية</label>
                    <input type="datetime-local" id="startDate" required>
                </div>
                <div class="form-group">
                    <label>تاريخ النهاية</label>
                    <input type="datetime-local" id="endDate" required>
                </div>
                <button type="submit" class="btn-primary">إضافة الإعلان</button>
            </form>

            <h2>الإعلانات النشطة</h2>
            <div id="adsList"></div>
        </div>

        <!-- تبويب المستخدمين -->
        <div class="tab-content" id="users">
            <h2>إدارة المستخدمين</h2>
            <ul class="users-list" id="usersList"></ul>
        </div>

        <!-- تبويب الإعدادات -->
        <div class="tab-content" id="settings">
            <h2>تغيير كلمة المرور</h2>
            <form id="passwordForm">
                <div class="form-group">
                    <label>كلمة المرور الجديدة</label>
                    <input type="password" id="newPassword" required placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>تأكيد كلمة المرور</label>
                    <input type="password" id="confirmPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">تحديث كلمة المرور</button>
            </form>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
