<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة الجاسوس</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div id="mainScreen" class="screen active">
    <h1>🎯 لعبة الجاسوس</h1>
    <input type="text" id="playerName" placeholder="ادخل اسمك" />
    <button class="btn-primary" onclick="showRoomSelection()">التالي</button>
  </div>

  <div id="roomSelection" class="screen">
    <h2>اختر نوع الغرفة</h2>
    <button class="btn-secondary" onclick="showCreateRoom()">إنشاء غرفة جديدة</button>
    <button class="btn-secondary" onclick="showJoinRoom()">الانضمام إلى غرفة عامة</button>
    <button class="btn-secondary" onclick="showPrivateJoin()">الانضمام عبر الرمز</button>
  </div>

  <div id="createRoomScreen" class="screen">
    <h2>إنشاء غرفة</h2>
    <input type="text" id="roomName" placeholder="اسم الغرفة" />
    <button class="btn-primary" onclick="createRoom()">إنشاء</button>
    <button class="btn-secondary" onclick="goBack()">رجوع</button>
  </div>

  <div id="joinRoomScreen" class="screen">
    <h2>الغرف العامة</h2>
    <div id="roomsList"></div>
    <button class="btn-secondary" onclick="goBack()">رجوع</button>
  </div>

  <div id="privateJoinScreen" class="screen">
    <h2>الانضمام عبر الرمز</h2>
    <input type="text" id="roomCodeInput" placeholder="ادخل رمز الغرفة" />
    <button class="btn-primary" onclick="joinByCode()">دخول</button>
    <button class="btn-secondary" onclick="goBack()">رجوع</button>
  </div>

  <div id="gameScreen" class="screen">
    <h2 id="gameTitle">اللعبة بدأت!</h2>
    <div id="gameContent"></div>
  </div>

  <script>
    const socket = io();
    let playerName = '';
    let roomId = '';
    let userId = '';

    function showRoomSelection() {
      playerName = document.getElementById('playerName').value.trim();
      if (!playerName) return alert('الرجاء إدخال الاسم');
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('roomSelection').classList.add('active');
    }

    function showCreateRoom() {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('createRoomScreen').classList.add('active');
    }

    function showJoinRoom() {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('joinRoomScreen').classList.add('active');
      socket.emit('getRooms');
    }

    function showPrivateJoin() {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('privateJoinScreen').classList.add('active');
    }

    function goBack() {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('roomSelection').classList.add('active');
    }

    function createRoom() {
      const roomName = document.getElementById('roomName').value.trim();
      if (!roomName) return alert('اكتب اسم الغرفة');
      socket.emit('createRoom', { name: roomName, userName: playerName });
    }

    socket.on('roomCreated', (data) => {
      roomId = data.roomId;
      userId = data.userId;
      alert(`تم إنشاء الغرفة بنجاح! الرمز: ${data.roomCode}`);
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('gameScreen').classList.add('active');
    });

    // ✅ تحديث تلقائي لقائمة الغرف العامة
    socket.on('roomsUpdated', (rooms) => {
      const roomsList = document.getElementById('roomsList');
      if (!rooms || rooms.length === 0) {
        roomsList.innerHTML = '<p style="text-align: center; color: #999;">لا توجد غرف متاحة حالياً</p>';
        return;
      }
      roomsList.innerHTML = rooms.map(room => `
        <div class="player-item" style="cursor: pointer;" onclick="joinRoom('${room.id}')">
          <div>
            <div class="player-name">${room.name}</div>
            <div class="player-role">${room.players.length} / ${room.maxPlayers} لاعبين</div>
          </div>
        </div>
      `).join('');
    });

    function joinRoom(id) {
      socket.emit('joinRoom', { roomId: id, userName: playerName });
    }

    function joinByCode() {
      const code = document.getElementById('roomCodeInput').value.trim();
      if (!code) return alert('الرجاء إدخال رمز الغرفة');
      socket.emit('joinRoomByCode', { code, userName: playerName });
    }

    // ✅ شاشة التخمين للجاسوس (8 كلمات)
    socket.on('waitingForSpyGuess', (data) => {
      showSpyGuessScreen(data.words);
    });

    function showSpyGuessScreen(words) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      const container = document.createElement('div');
      container.innerHTML = `
        <h2>🕵️ اختر الكلمة الصحيحة!</h2>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          ${words.map(w => `<button class="btn-secondary" onclick="submitSpyGuess('${w}', event)">${w}</button>`).join('')}
        </div>
      `;
      document.body.innerHTML = '';
      document.body.appendChild(container);
    }

    function submitSpyGuess(word, event) {
      event.preventDefault();
      socket.emit('spyGuess', { roomId, userId, word });
    }

    // ✅ عرض النتيجة بعد تخمين الجاسوس
    socket.on('spyFinalResult', (data) => {
      alert(data.isCorrect ? '🎉 الجاسوس خمّن الكلمة الصحيحة وفاز!' : '🏆 فاز الفريق! الجاسوس أخطأ.');
      location.reload();
    });
  </script>
</body>
</html>
