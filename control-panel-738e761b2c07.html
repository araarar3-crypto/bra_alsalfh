<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الإدارية</title>
    <style>
        :root { --primary: #667eea; --secondary: #764ba2; --bg: #f4f7f6; --text: #333; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 25px; text-align: center; position: relative; }
        .logout-btn { position: absolute; left: 20px; top: 25px; background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 5px 15px; border-radius: 5px; cursor: pointer; }
        .tabs { display: flex; background: #eee; }
        .tab-btn { flex: 1; padding: 15px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: white; color: var(--primary); border-bottom: 3px solid var(--primary); }
        .content { padding: 30px; display: none; }
        .content.active { display: block; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        .btn-submit { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; }
        .btn-submit:hover { background: var(--secondary); }
        .ad-card { background: #f9f9f9; border: 1px solid #eee; padding: 20px; border-radius: 10px; margin-bottom: 20px; position: relative; }
        .ad-card h4 { color: var(--primary); margin-bottom: 10px; }
        .ad-images { display: flex; gap: 10px; margin: 15px 0; }
        .ad-images img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 2px solid #ddd; }
        .btn-delete { background: #ff4d4d; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; float: left; }
        .login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-box { background: white; padding: 40px; border-radius: 15px; width: 100%; max-width: 400px; }
        .message { padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; display: none; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div id="loginScreen" class="login-screen">
    <div class="login-box">
        <h2 style="text-align: center; margin-bottom: 20px;">تسجيل الدخول</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="loginEmail" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="loginPassword" required>
            </div>
            <button type="submit" class="btn-submit">دخول</button>
        </form>
    </div>
</div>

<div id="adminPanel" class="container" style="display: none;">
    <div class="header">
        <button class="logout-btn" onclick="logout()">خروج</button>
        <h1>لوحة التحكم</h1>
    </div>
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('ads-tab', this)">إدارة الإعلانات</button>
        <button class="tab-btn" onclick="showTab('stats-tab', this)">الإحصائيات</button>
    </div>

    <div id="ads-tab" class="content active">
        <div id="msg" class="message"></div>
        <form id="adForm">
            <div class="form-group">
                <label>عنوان الإعلان</label>
                <input type="text" id="adTitle" required placeholder="مثال: عرض الصيف">
            </div>
            <div class="form-group">
                <label>وصف الإعلان</label>
                <textarea id="adDescription" required placeholder="اكتب تفاصيل الإعلان هنا"></textarea>
            </div>
            <div class="form-group" style="background: #fff9e6; padding: 15px; border-radius: 8px; border: 1px dashed #ffcc00;">
                <label style="color: #b8860b;">🔗 رابط الإعلان (مهم جداً)</label>
                <input type="url" id="adLink" placeholder="https://example.com" style="border-color: #ffcc00;">
                <small>سيتم توجيه المستخدم لهذا الرابط عند الضغط على الإعلان</small>
            </div>
            <div class="form-group">
                <label>صور الإعلان (يمكنك اختيار حتى 3 صور)</label>
                <input type="file" id="adImages" multiple accept="image/*">
            </div>
            <div class="form-group">
                <label>نوع الإعلان</label>
                <select id="adClosable">
                    <option value="true">قابل للإغلاق (يظهر زر إغلاق)</option>
                    <option value="false">إجباري (لا يظهر زر إغلاق)</option>
                </select>
            </div>
            <button type="submit" class="btn-submit">نشر الإعلان الآن</button>
        </form>

        <hr style="margin: 40px 0;">
        <h3>📢 الإعلانات النشطة حالياً</h3>
        <div id="adsList" style="margin-top: 20px;">
            <p style="text-align: center; color: #999;">جاري تحميل الإعلانات...</p>
        </div>
    </div>

    <div id="stats-tab" class="content">
        <h3>📈 إحصائيات اللعبة</h3>
        <div id="statsContent" style="margin-top: 20px;"></div>
    </div>
</div>

<script>
    // التحقق من الجلسة
    if (sessionStorage.getItem('isAdmn')) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadAds();
    }

    // تسجيل الدخول
    document.getElementById('loginForm').onsubmit = async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        
        const res = await fetch('/api/admin-login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email, password})
        });
        const data = await res.json();
        if (data.success) {
            sessionStorage.setItem('isAdmn', 'true');
            location.reload();
        } else {
            alert('خطأ في البيانات');
        }
    };

    function logout() {
        sessionStorage.clear();
        location.reload();
    }

    function showTab(id, btn) {
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
        if (id === 'stats-tab') loadStats();
    }

    // إنشاء إعلان
    document.getElementById('adForm').onsubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData();
        formData.append('adTitle', document.getElementById('adTitle').value);
        formData.append('adDescription', document.getElementById('adDescription').value);
        formData.append('adLink', document.getElementById('adLink').value);
        formData.append('adClosable', document.getElementById('adClosable').value);
        
        const files = document.getElementById('adImages').files;
        for(let f of files) formData.append('adImages', f);

        const res = await fetch('/api/advertisements', { method: 'POST', body: formData });
        if (res.ok) {
            alert('تم النشر!');
            document.getElementById('adForm').reset();
            loadAds();
        }
    };

    async function loadAds() {
        const list = document.getElementById('adsList');
        try {
            const res = await fetch('/api/advertisements');
            const ads = await res.json();
            console.log("Ads loaded:", ads); // للتشخيص
            
            if (ads.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #999;">لا توجد إعلانات نشطة</p>';
                return;
            }

            list.innerHTML = ads.map(ad => `
                <div class="ad-card">
                    <button class="btn-delete" onclick="deleteAd(${ad.id})">حذف الإعلان</button>
                    <h4>${ad.title}</h4>
                    <p>${ad.description}</p>
                    ${ad.link ? `<p style="color:blue; font-size:12px;">الرابط: ${ad.link}</p>` : ''}
                    <div class="ad-images">
                        ${ad.images.map(img => `<img src="${img}">`).join('')}
                    </div>
                    <small>المشاهدات: ${ad.views} | النقرات: ${ad.clicks}</small>
                </div>
            `).join('');
        } catch (err) {
            list.innerHTML = '<p style="color:red;">فشل تحميل الإعلانات</p>';
        }
    }

    async function deleteAd(id) {
        if (!confirm('حذف؟')) return;
        await fetch(`/api/advertisements/${id}`, { method: 'DELETE' });
        loadAds();
    }

    async function loadStats() {
        const pass = prompt('كلمة مرور الإحصائيات:');
        if (!pass) return;
        const res = await fetch(`/api/statistics?password=${pass}`);
        const s = await res.json();
        document.getElementById('statsContent').innerHTML = `
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <div style="background:#eee; padding:20px; border-radius:10px;">متصلون: ${s.onlinePlayers}</div>
                <div style="background:#eee; padding:20px; border-radius:10px;">إجمالي اللاعبين: ${s.totalPlayers}</div>
                <div style="background:#eee; padding:20px; border-radius:10px;">المشاهدات: ${s.totalViews}</div>
                <div style="background:#eee; padding:20px; border-radius:10px;">النقرات: ${s.totalClicks}</div>
            </div>
        `;
    }
</script>
</body>
</html>
