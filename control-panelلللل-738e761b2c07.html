<!-- ============================================ -->
<!-- صفحة لوحة التحكم الجديدة (تم التأكد من ربطها بالخادم) -->
<!-- ============================================ -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوح التحكم</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
    .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 28px; }
    .btn-header { background: rgba(255,255,255,0.2); color: white; border: 2px solid white; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: all 0.3s; }
    .btn-header:hover { background: rgba(255,255,255,0.3); }
    .tabs { display: flex; border-bottom: 2px solid #e0e0e0; }
    .tab-btn { flex: 1; padding: 20px; background: #f8f9fa; border: none; cursor: pointer; font-size: 16px; font-weight: 600; color: #666; transition: all 0.3s; border-bottom: 3px solid transparent; }
    .tab-btn:hover { background: #e8e9eb; }
    .tab-btn.active { color: #667eea; border-bottom-color: #667eea; background: white; }
    .tab-content { display: none; padding: 30px; }
    .tab-content.active { display: block; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; font-family: inherit; transition: border-color 0.3s; }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #667eea; }
    .form-group textarea { resize: vertical; min-height: 100px; }
    .btn-submit { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s; }
    .btn-submit:hover { transform: translateY(-2px); }
    .ad-item { background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 15px; }
    .ad-info { text-align: right; }
    .ad-images { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .ad-images img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; cursor: pointer; transition: transform 0.2s; border: 2px solid #e0e0e0; }
    .ad-images img:hover { transform: scale(1.1); border-color: #667eea; }
    .ad-actions { display: flex; gap: 10px; justify-content: flex-end; align-items: center; }
    .ad-info h4 { color: #667eea; margin-bottom: 5px; }
    .ad-info p { color: #666; font-size: 14px; margin-bottom: 5px; }
    .btn-delete { background: #ff6b6b; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-right: 10px; }
    .btn-delete:hover { background: #ff5252; }
    .stat-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 15px; }
    .stat-card h3 { font-size: 32px; margin-bottom: 10px; }
    .stat-card p { font-size: 14px; opacity: 0.9; }
    .message { padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; display: none; }
    .message.success { background: #d4edda; color: #155724; display: block; }
    .message.error { background: #f8d7da; color: #721c24; display: block; }
    .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 400px; width: 100%; }
    .login-box h2 { text-align: center; color: #667eea; margin-bottom: 30px; }
    .dark-mode { background: #1a1a1a; color: white; }
    .dark-mode .container { background: #2a2a2a; color: white; }
    .dark-mode .login-box { background: #2a2a2a; color: white; }
    .dark-mode .form-group label { color: #e0e0e0; }
    .dark-mode .form-group input, .dark-mode .form-group textarea, .dark-mode .form-group select { background: #333; color: white; border-color: #444; }
    .dark-mode .tab-btn { background: #333; color: #e0e0e0; }
    .dark-mode .tab-btn.active { color: #667eea; background: #2a2a2a; }
    .dark-mode .ad-item { background: #333; }
    .dark-mode .ad-info p { color: #b0b0b0; }
    .dark-mode .ad-images img { border-color: #444; }
  </style>
</head>
<body>
  <!-- شاشة تسجيل الدخول -->
  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <h2>🎛️ لوح التحكم</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="loginEmail" placeholder="أدخل بريدك الإلكتروني" required>
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور" required>
        </div>
        <button type="submit" class="btn-submit">دخول</button>
      </form>
    </div>
  </div>
  
  <!-- لوح التحكم الرئيسي -->
  <div id="adminPanel" style="display: none;">
    <div class="container">
      <div class="header">
        <h1>🎛️ لوح التحكم</h1>
        <div>
          <button class="btn-header" id="darkModeBtn">🌙 الدارك مود</button>
          <button class="btn-header" id="logoutBtn">تسجيل الخروج</button>
        </div>
      </div>
      
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('dashboard')">📊 لوحة التحكم</button>
        <button class="tab-btn" onclick="switchTab('advertisements')">📢 الإعلانات</button>
        <button class="tab-btn" onclick="switchTab('statistics')">📈 الإحصائيات</button>
      </div>
      
      <!-- لوحة التحكم الرئيسية -->
      <div id="dashboard" class="tab-content active">
        <h2>مرحباً بك في لوح التحكم</h2>
        <p style="color: #666; margin-top: 10px;">استخدم الخيارات أعلاه لإدارة الإعلانات والإحصائيات</p>
      </div>
      
      <!-- تبويب الإعلانات -->
      <div id="advertisements" class="tab-content">
        <h2>إنشاء إعلان جديد</h2>
        <div id="message" class="message"></div>
        
        <form id="adForm">
          <div class="form-group">
            <label>عنوان الإعلان</label>
            <input type="text" id="adTitle" placeholder="مثال: عرض خاص" required>
          </div>
          
          <div class="form-group">
            <label>وصف الإعلان</label>
            <textarea id="adDescription" placeholder="أدخل وصف الإعلان" required></textarea>
          </div>
          
          <div class="form-group">
            <label>رابط الإعلان (اختياري)</label>
            <input type="url" id="adLink" placeholder="https://example.com">
          </div>
          
          <div class="form-group">
            <label>مدة الإعلان</label>
            <select id="adDuration">
              <option value="1">يوم واحد</option>
              <option value="3">3 أيام</option>
              <option value="7">أسبوع واحد</option>
              <option value="30">شهر واحد</option>
            </select>
          </div>
          
          <div class="form-group">
            <label>صور الإعلان (اختياري - يمكن إضافة عدة صور)</label>
            <input type="file" id="adImages" multiple accept="image/*">
          </div>
          
          <div class="form-group">
            <label>خيار الإغلاق</label>
            <select id="adClosable">
              <option value="true">✅ اللاعبون يقدرون يغلقون الإعلان</option>
              <option value="false">❌ اللاعبون ما يقدرون يغلقون الإعلان</option>
            </select>
          </div>
          
          <button type="submit" class="btn-submit">إنشاء الإعلان</button>
        </form>
        
        <div style="margin-top: 30px;">
          <h3>الإعلانات النشطة</h3>
          <div id="activeAdsList" style="margin-top: 15px;"></div>
        </div>
      </div>
      
      <!-- تبويب الإحصائيات -->
      <div id="statistics" class="tab-content">
        <h2>الإحصائيات</h2>
        <div id="statsContainer"></div>
      </div>
    </div>
  </div>
  
  <script>
    let isDarkMode = localStorage.getItem('adminDarkMode') === 'true';
    
    if (isDarkMode) {
      document.body.classList.add('dark-mode');
    }
    
    // ✅ تسجيل الدخول الآمن - الاتصال بالخادم
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      
      try {
        const response = await fetch('/api/admin-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (response.ok && data.success) {
          sessionStorage.setItem('adminLoggedIn', 'true');
          sessionStorage.setItem('adminEmail', email);
          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('adminPanel').style.display = 'block';
          loadAdvertisements();
          loadStatistics();
        } else {
          alert('❌ ' + (data.error || 'فشل تسجيل الدخول'));
        }
      } catch (error) {
        console.error('خطأ:', error);
        alert('❌ خطأ في الاتصال بالخادم');
      }
    });
    // تسجيل الخروج
    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem('adminLoggedIn');
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('adminPanel').style.display = 'none';
      document.getElementById('loginForm').reset();
    });
    
    // الدارك مود
    document.getElementById('darkModeBtn').addEventListener('click', () => {
      isDarkMode = !isDarkMode;
      localStorage.setItem('adminDarkMode', isDarkMode);
      document.body.classList.toggle('dark-mode');
    });
    
    // تبديل التبويبات
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');
      
      if (tabName === 'statistics') {
        loadStatistics();
      }
    }
    
    // إنشاء إعلان
    document.getElementById('adForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const formData = new FormData();
      formData.append('adTitle', document.getElementById('adTitle').value);
      formData.append('adDescription', document.getElementById('adDescription').value);
      formData.append('adLink', document.getElementById('adLink').value);
      formData.append('adDuration', document.getElementById('adDuration').value);
      formData.append('adClosable', document.getElementById('adClosable').value);
      
      const files = document.getElementById('adImages').files;
      for (let file of files) {
        formData.append('adImages', file);
      }
      
      try {
        const response = await fetch('/api/advertisements', {
          method: 'POST',
          body: formData
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showMessage('✅ تم إنشاء الإعلان بنجاح!', 'success');
          document.getElementById('adForm').reset();
          loadAdvertisements();
        } else {
          showMessage('❌ ' + (data.error || 'فشل إنشاء الإعلان'), 'error');
        }
      } catch (error) {
        console.error('خطأ:', error);
        showMessage('❌ خطأ في الاتصال بالخادم', 'error');
      }
    });
    
    // تحميل الإعلانات
    async function loadAdvertisements() {
      try {
        const response = await fetch('/api/advertisements');
        const ads = await response.json();
        
        const list = document.getElementById('activeAdsList');
        list.innerHTML = '';
        
        if (ads.length === 0) {
          list.innerHTML = '<p style="color: #999;">لا توجد إعلانات نشطة</p>';
          return;
        }
        
        ads.forEach(ad => {
          const div = document.createElement('div');
          div.className = 'ad-item';
          
          let imagesHTML = '';
          if (ad.images && ad.images.length > 0) {
            imagesHTML = '<div class="ad-images">';
            ad.images.forEach(img => {
              imagesHTML += `<img src="${img}" alt="صورة الإعلان" onclick="window.open('${img}', '_blank')" title="اضغط لفتح الصورة">`;
            });
            imagesHTML += '</div>';
          }
          
          let linkHTML = '';
          if (ad.link) {
            linkHTML = `<p><a href="${ad.link}" target="_blank" style="color: #667eea; text-decoration: none; font-weight: 600;">اضغط لفتح الموقع الإلكتروني ↗</a></p>`;
          }
          
          div.innerHTML = `
            <div class="ad-info">
              <h4>${ad.title}</h4>
              <p>${ad.description}</p>
              ${linkHTML}
              <p>المشاهدات: ${ad.views} | النقرات: ${ad.clicks}</p>
              <p style="color: #999; font-size: 12px;">الحالة: <span style="color: #4caf50;">نشط ✓</span></p>
            </div>
            ${imagesHTML}
            <div class="ad-actions">
              <button class="btn-delete" onclick="deleteAd(${ad.id})">حذف</button>
            </div>
          `;
          list.appendChild(div);
        });
      } catch (error) {
        console.error('خطأ في تحميل الإعلانات:', error);
      }
    }
    
    // حذف إعلان
    async function deleteAd(adId) {
      if (!confirm('هل تريد حذف هذا الإعلان؟')) return;
      
      try {
        const response = await fetch(`/api/advertisements/${adId}`, {
          method: 'DELETE'
        });
        
        if (response.ok) {
          showMessage('✅ تم حذف الإعلان بنجاح', 'success');
          loadAdvertisements();
        } else {
          showMessage('❌ فشل حذف الإعلان', 'error');
        }
      } catch (error) {
        console.error('خطأ:', error);
        showMessage('❌ خطأ في الاتصال بالخادم', 'error');
      }
    }
    
    // تحميل الإحصائيات
    async function loadStatistics() {
      try {
        // 1. اطلب من المستخدم إدخال كلمة المرور (لن تُحفظ في الكود)
        const password = prompt('أدخل كلمة مرور الإحصائيات:');
        
        // 2. إذا لم يدخل شيء، توقف
        if (!password) return;
        
        // 3. أرسل الطلب مع كلمة المرور
        const response = await fetch(`/api/statistics?password=${password}`);
        const stats = await response.json();
        
        // 4. عرض الإحصائيات
        const container = document.getElementById('statsContainer');
        container.innerHTML = `
          <div class="stat-card"><h3>${stats.onlinePlayers || 0}</h3><p>اللاعبون المتصلون الآن</p></div>
          <div class="stat-card"><h3>${stats.totalPlayers || 0}</h3><p>إجمالي اللاعبين</p></div>
          <div class="stat-card"><h3>${stats.advertisements || 0}</h3><p>عدد الإعلانات</p></div>
          <div class="stat-card"><h3>${stats.totalViews || 0}</h3><p>إجمالي المشاهدات</p></div>
          <div class="stat-card"><h3>${stats.totalClicks || 0}</h3><p>إجمالي النقرات</p></div>`;
      } catch (error) {
        console.error('خطأ في تحميل الإحصائيات:', error);
      }
    }
    
    // عرض الرسائل
    function showMessage(text, type) {
      const messageEl = document.getElementById('message');
      messageEl.textContent = text;
      messageEl.className = `message ${type}`;
      setTimeout(() => {
        messageEl.className = 'message';
      }, 3000);
    }
    
    // التحقق من تسجيل الدخول عند التحميل
    window.addEventListener('load', () => {
      if (sessionStorage.getItem('adminLoggedIn') === 'true') {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadAdvertisements();
      }
    });
  </script>
</body>
</html>
