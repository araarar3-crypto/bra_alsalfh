<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصل بنا - برا السالفة</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            line-height: 1.8; 
            padding: 40px 20px; 
            color: #333; 
            max-width: 600px; 
            margin: auto; 
            background-color: #f9f9f9; 
            text-align: center;
        }
        h1 { color: #2d3748; margin-bottom: 10px; }
        p { margin-bottom: 30px; color: #666; }
        .contact-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; }
        .btn-email { background-color: #e2e8f0; color: #2d3748; }
        .btn-insta { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); color: white; }
        .btn-tiktok { background-color: #000000; color: white; }
    </style>
</head>
<body>
    <h1>تواصل معنا</h1>
    <p>حياك الله، عندك اقتراح للعبة أو واجهت مشكلة؟<br>سعيدين بسماع صوتك عبر قنواتنا:</p>
    
    <div class="contact-card">
        <a href="mailto:asa6erm3@gmail.com" class="btn btn-email">
            📧 إرسال بريد إلكتروني
        </a>

        <a href="https://instagram.com/3lbod" target="_blank" class="btn btn-insta">
            📸 تواصل معنا على Instagram
        </a>

        <a href="https://www.tiktok.com/@bra_alsalfh" target="_blank" class="btn btn-tiktok">
            🎵 تابعنا على TikTok
        </a>
    </div>

    <p style="font-size: 0.9em; margin-top: 40px;">
        <a href="/" style="color: #667eea; text-decoration: none;">العودة للعبة</a>
    </p>
</body>
</html>
